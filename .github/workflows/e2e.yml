name: E2E smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: "mongodb://localhost:27017/redrive_ci"
  NEXTAUTH_SECRET: "ci-placeholder-secret-not-used-at-runtime"
  NEXTAUTH_URL: "http://localhost:3100"
  RATE_LIMIT_SECRET: "ci-placeholder-rate-limit-secret"
  NEXT_TELEMETRY_DISABLED: "1"
  E2E_PORT: "3100"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22.13.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run smoke suite
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        # Diagnostic only, so a failure here must never redden a run whose
        # actual test suite passed. Finalization uses the runner-issued
        # ACTIONS_RUNTIME_TOKEN, not GITHUB_TOKEN, so this isn't fixable with
        # `permissions:` — it's a known intermittent artifact-service issue
        # (see actions/upload-artifact#560, open since 2024, no root cause or
        # fix from GitHub). continue-on-error is the correct response: accept
        # an occasionally-missing report rather than block merges on it.
        continue-on-error: true
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
