name: E2E smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

# The repo's default workflow token permissions are read-only. Checkout only
# needs that, but actions/upload-artifact@v4 needs `actions: write` to finalize
# the report upload — without it the step fails with a 403 from the artifact
# service even though the suite itself passed.
permissions:
  contents: read
  actions: write

env:
  DATABASE_URL: "mongodb://localhost:27017/redrive_ci"
  NEXTAUTH_SECRET: "ci-placeholder-secret-not-used-at-runtime"
  NEXTAUTH_URL: "http://localhost:3100"
  RATE_LIMIT_SECRET: "ci-placeholder-rate-limit-secret"
  NEXT_TELEMETRY_DISABLED: "1"
  E2E_PORT: "3100"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22.13.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run smoke suite
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        # Diagnostic only — the report is for debugging a failure locally, so a
        # flaky upload (artifact-service hiccup, permission drift) must not fail
        # a run whose actual test suite passed.
        continue-on-error: true
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
